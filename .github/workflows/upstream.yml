name: Upstream

on:
  workflow_call:
    inputs:
      composer-cache-dir:
        type: string
        required: true
      generate-static:
        type: boolean
        default: false
      branch-slug:
        type: string
        default: main
    outputs:
      has-changes:
        value: ${{ jobs.import.outputs.has-changes }}
      sqlite-artifact-id:
        value: ${{ jobs.import.outputs.sqlite-artifact-id }}
      static-artifact-id:
        value: ${{ jobs.import.outputs.static-artifact-id }}

jobs:
  import:
    name: Imports
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    outputs:
      has-changes: ${{ steps.stats.outputs.has-changes }}
      sqlite-artifact-id: ${{ steps.sqlite.outputs.artifact-id }}
      static-artifact-id: ${{ steps.static.outputs.artifact-id }}

    env:
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: ${{ github.repository_owner }}
      UPSTREAM_DB_DATABASE: nusantara
      GIT_BRANCH: ${{ inputs.branch-slug }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Restore sqlite
        id: sqlite-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Kept in their own directory: `actions/cache` derives the cache version from
          # the paths, and a branch slug such as `upstream` would otherwise collide.
          path: |
            database/cache/nusa-full.sqlite
            database/cache/nusa.sqlite
          key: upstream-sqlite-${{ hashFiles('workbench/submodules/**/*.sql', 'workbench/app/**/*.php', 'database/migrations/**') }}

      - name: Rename restored sqlite
        if: steps.sqlite-cache.outputs.cache-hit == 'true'
        env:
          SLUG: ${{ inputs.branch-slug }}
        run: |
          mv database/cache/nusa-full.sqlite "database/nusa.$SLUG-full.sqlite"
          mv database/cache/nusa.sqlite "database/nusa.$SLUG.sqlite"

      - name: Setup MySQL
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        run: |
          sudo /etc/init.d/mysql start
          mysql -e "CREATE DATABASE $DB_DATABASE;" -u"$DB_USERNAME" -p"$DB_PASSWORD"
          mysql -e "CREATE DATABASE $UPSTREAM_DB_DATABASE;" -u"$DB_USERNAME" -p"$DB_PASSWORD"

      - name: Setup SQLite tools
        env:
          SQLITE_VERSION: 3530400 # v3.53.4
          EXPECTED_SHA3: 6eeb57e8f2aef7687f9f016a980992cf2799c8c07a87c5e21495530f91915047
        run: |
          set -euo pipefail

          DIST="sqlite-tools-linux-x64-${SQLITE_VERSION}"
          curl -fsSL -o /tmp/sqlite-tools.zip "https://www.sqlite.org/2026/${DIST}.zip"

          # Verify the SHA3-256 digest published on https://www.sqlite.org/download.html
          ACTUAL_SHA3="$(openssl dgst -sha3-256 /tmp/sqlite-tools.zip | awk '{print $NF}')"
          test "${ACTUAL_SHA3}" = "${EXPECTED_SHA3}"

          sudo unzip -o /tmp/sqlite-tools.zip -d /tmp
          sudo cp /tmp/{sqlite3,sqldiff,sqlite3_analyzer} /usr/local/bin/

          sqlite3 --version
          sqldiff --help >/dev/null 2>&1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.composer-cache-dir }}
          key: php-${{ matrix.php }}-l${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: php-${{ matrix.php }}-l${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress

      - name: Import databases
        id: imports
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        env:
          COLUMNS: 100
        run: |
          vendor/bin/testbench nusa:import --fresh --dist --ansi

      - name: Stat summary
        id: stats
        env:
          COLUMNS: 160
        run: |
          vendor/bin/testbench nusa:stat --ansi --output=stat-report.md

      - name: Report upstream changes
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          steps.stats.outputs.has-changes == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | contains("<!-- nusa-stat -->")) | .id' | tail -n1)

          if [ -n "$id" ]; then
            jq -Rs '{body: .}' stat-report.md \
              | gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - >/dev/null
          else
            gh pr comment "$PR" --body-file stat-report.md >/dev/null
          fi

      - name: Retitle upstream bump PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          steps.stats.outputs.has-changes == '1' &&
          startsWith(github.event.pull_request.head.ref, 'dependabot/submodules/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          name="${HEAD_REF##*/}" # cahyadsn-wilayah_boundaries-2c0d8c7
          name="${name%-*}"      # cahyadsn-wilayah_boundaries
          path="workbench/submodules/$name"
          sha=$(git -C "$path" rev-parse --short=7 HEAD)

          key=$(git config -f .gitmodules --get-regexp '\.path$' | awk -v path="$path" '$2 == path { print $1 }')
          url=$(git config -f .gitmodules "${key%.path}.url")
          repo="${url#https://github.com/}"
          repo="${repo%.git}"

          title="feat(upstream): bump ${repo}#${sha}"
          current=$(gh pr view "$PR" --json title --jq .title)

          [ "$current" = "$title" ] || gh pr edit "$PR" --title "$title"

      - name: Upload sqlite artifacts
        id: sqlite
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # PR artifacts are consumed by the same run; only main's are worth keeping.
          retention-days: ${{ github.ref_name == 'main' && 30 || 7 }}
          overwrite: true
          name: sqlite-artifacts_${{ inputs.branch-slug }}
          path: |
            database/nusa.${{ inputs.branch-slug }}-full.sqlite
            database/nusa.${{ inputs.branch-slug }}.sqlite

      - name: Generate static files
        if: >-
          inputs.generate-static == true ||
          (steps.stats.outputs.has-changes == '1' && github.ref_name == 'main')
        env:
          COLUMNS: 100
        run: |
          vendor/bin/testbench nusa:generate-static --ansi
          du -hd 1 resources/static

      - name: Upload static artifacts
        id: static
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          inputs.generate-static == true ||
          (steps.stats.outputs.has-changes == '1' && github.ref_name == 'main')
        with:
          name: static-artifacts-${{ inputs.branch-slug }}
          path: resources/static
          retention-days: 30
          overwrite: true

      # Must stay the last step: everything above resolves the database at boot.
      - name: Stage cache paths
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        env:
          SLUG: ${{ inputs.branch-slug }}
        run: |
          mkdir -p database/cache

          mv "database/nusa.$SLUG-full.sqlite" database/cache/nusa-full.sqlite
          mv "database/nusa.$SLUG.sqlite" database/cache/nusa.sqlite
