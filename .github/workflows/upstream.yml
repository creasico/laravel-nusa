name: Upstream

on:
  workflow_call:
    inputs:
      composer-cache-dir:
        type: string
        required: true
      generate-static:
        type: boolean
        default: false
      branch-name:
        type: string
        default: main
      branch-slug:
        type: string
        default: main
    outputs:
      has-changes:
        value: ${{ jobs.import.outputs.has-changes }}
      sqlite-artifact-id:
        value: ${{ jobs.import.outputs.sqlite-artifact-id }}
      static-artifact-id:
        value: ${{ jobs.import.outputs.static-artifact-id }}

jobs:
  import:
    name: Imports
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.stats.outputs.has-changes }}
      sqlite-artifact-id: ${{ steps.sqlite.outputs.artifact-id }}
      static-artifact-id: ${{ steps.static.outputs.artifact-id }}

    env:
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: ${{ github.repository_owner }}
      UPSTREAM_DB_DATABASE: nusantara
      GIT_BRANCH: ${{ inputs.branch-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # - name: Upstream state
      #   id: state
      #   run: |
      #     git submodule foreach --quiet 'echo "$(git rev-parse HEAD) $name"' >> workbench/upstream.${{ inputs.branch-slug }}.state
      #     echo "key=upstream-${{ inputs.branch-slug }}-${{ hashFiles('workbench/upstream.*.state') }}" >> "$GITHUB_OUTPUT"

      # - name: Cache upstream
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: workbench/upstream.${{ inputs.branch-slug }}.state
      #     key: ${{ steps.state.outputs.key }}

      # - name: Set cache key
      #   id: cache-key
      #   run: echo "key=upstream-database_${{ hashFiles('**/*.sql') }}" >> "$GITHUB_OUTPUT"

      - name: Cache upstream states
        id: upstream-states
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: database/nusa.*.csv
          key: upstream-${{ inputs.branch-slug }}-${{ github.sha }}
          restore-keys: |
            upstream-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.base.sha }}
            upstream-${{ github.event.pull_request.base.ref }}-
            upstream-${{ inputs.branch-slug }}-

      - name: Check states
        if: ${{ steps.upstream-states.outputs.cache-hit != 'true' }}
        run: |
          ls -lah database

      - name: Setup MySQL
        if: ${{ steps.upstream-states.outputs.cache-hit != 'true' }}
        run: |
          sudo /etc/init.d/mysql start
          mysql -e "CREATE DATABASE $DB_DATABASE;" -u"$DB_USERNAME" -p"$DB_PASSWORD"
          mysql -e "CREATE DATABASE $UPSTREAM_DB_DATABASE;" -u"$DB_USERNAME" -p"$DB_PASSWORD"

      - name: Setup SQLite tools
        env:
          SQLITE_VERSION: 3530400 # v3.53.4
          EXPECTED_SHA3: 6eeb57e8f2aef7687f9f016a980992cf2799c8c07a87c5e21495530f91915047
        run: |
          set -euo pipefail

          DIST="sqlite-tools-linux-x64-${SQLITE_VERSION}"
          curl -fsSL -o /tmp/sqlite-tools.zip "https://www.sqlite.org/2026/${DIST}.zip"

          # Verify the SHA3-256 digest published on https://www.sqlite.org/download.html
          ACTUAL_SHA3="$(openssl dgst -sha3-256 /tmp/sqlite-tools.zip | awk '{print $NF}')"
          test "${ACTUAL_SHA3}" = "${EXPECTED_SHA3}"

          sudo unzip -o /tmp/sqlite-tools.zip -d /tmp
          sudo cp /tmp/{sqlite3,sqldiff,sqlite3_analyzer} /usr/local/bin/

          sqlite3 --version
          sqldiff --help >/dev/null 2>&1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.composer-cache-dir }}
          key: php-${{ matrix.php }}-l${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: php-${{ matrix.php }}-l${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress

      - name: Import databases
        id: imports
        # if: ${{ steps.upstream-states.outputs.cache-hit != 'true' }}
        env:
          COLUMNS: 100
        run: |
          vendor/bin/testbench nusa:import --fresh --dist --ansi
          ls -lah database

      - name: Stat summary
        id: stats
        env:
          COLUMNS: 160
        run: |
          vendor/bin/testbench nusa:stat --ansi

      - name: Upload sqlite artifacts
        id: sqlite
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.generate-static == true || steps.stats.outputs.has-changes == '1'
        with:
          retention-days: 30
          overwrite: true
          name: sqlite-artifacts_${{ inputs.branch-slug }}
          path: |
            database/nusa.${{ inputs.branch-slug }}-full.sqlite
            database/nusa.${{ inputs.branch-slug }}.sqlite

      - name: Generate static files
        if: >-
          inputs.generate-static == true ||
          (steps.stats.outputs.has-changes == '1' && github.ref_name == 'main')
        env:
          COLUMNS: 100
        run: |
          vendor/bin/testbench nusa:generate-static --ansi
          du -hd 1 resources/static

      - name: Upload static artifacts
        id: static
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          inputs.generate-static == true ||
          (steps.stats.outputs.has-changes == '1' && github.ref_name == 'main')
        with:
          name: static-artifacts-${{ inputs.branch-slug }}
          path: resources/static
          retention-days: 30
          overwrite: true
