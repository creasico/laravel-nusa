name: Distribute
run-name: "dist(${{ github.event.workflow_run.head_branch }}): create distribution database"

on:
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: [CI]

jobs:
  prepare:
    name: Prepare
    uses: projek-xyz/actions/.github/workflows/prepare.yml@22d40bb8c8f18ea5bd59ec5680a5bd3d5a024697 # main @ 2026-10-14

  upstream:
    name: Upstream DB
    uses: ./.github/workflows/upstream.yml
    needs: [prepare]
    with:
      composer-cache-dir: ${{ needs.prepare.outputs.composer-cache-dir }}
      branch-name: ${{ github.ref_name }}
      generate-static: true

  distribute:
    name: Create Distribution Database
    runs-on: ubuntu-latest
    needs: [upstream]

    # Sets permissions of the GITHUB_TOKEN to allow pushing the database commit
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Cache upstream
        id: upstream
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: database/nusa.*.sqlite
          key: ${{ needs.upstream.outputs.cache-key }}

      - name: Commit distribution database
        if: ${{ needs.upstream.outputs.has-changes == '1' }}
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/commit-changes.sh

      - name: Create summary
        if: always()
        env:
          # COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
        run: ./.github/scripts/create-summary.sh

  # Build job
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [upstream]

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      - name: Set up pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          runtime: 'node@lts'
          install: true

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with VitePress
        run: pnpm docs:build

      - name: Download static artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-artifacts-${{ github.ref_name }}
          path: resources/docs/.vitepress/dist/api

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: resources/docs/.vitepress/dist

  # Deployment job
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
