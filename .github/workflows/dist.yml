name: Distribute
run-name: "dist(${{ github.event.workflow_run.head_branch }}): create distribution database"

on:
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: [CI]

jobs:
  prepare:
    name: Prepare
    uses: projek-xyz/actions/.github/workflows/prepare.yml@a84ced1eab6fac0576ed5cdd43f6ee0dfa5044a3 # main @ 2026-11-02
    with:
      # `workflow_run` keeps the triggering commit nested, so `prepare` cannot
      # pick up its message from the event default.
      commit-message: ${{ github.event.workflow_run.head_commit.message }}

  upstream:
    name: Upstream DB
    uses: ./.github/workflows/upstream.yml
    needs: [prepare]
    with:
      branch-slug: ${{ needs.prepare.outputs.branch-slug }}
      composer-cache-dir: ${{ needs.prepare.outputs.composer-cache-dir }}
      generate-static: true

  distribute:
    name: Create Distribution Database
    runs-on: ubuntu-latest
    needs: [upstream]

    # Sets permissions of the GITHUB_TOKEN to allow pushing the database commit
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Download sqlite artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.upstream.outputs.sqlite-artifact-id }}
          path: database

      - name: Commit distribution database
        if: ${{ needs.upstream.outputs.has-changes == '1' }}
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/scripts/commit-changes.sh

      - name: Create summary
        if: always()
        env:
          # COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
        run: ./.github/scripts/create-summary.sh

  release-assets:
    name: Release Assets
    # Not gated on the CI conclusion: this job builds its own data, so a cancelled
    # or failed CI run on main must not be able to withhold the release assets.
    if: needs.prepare.outputs.should-release == '1'
    runs-on: ubuntu-latest
    needs: [prepare, upstream]

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.prepare.outputs.project-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download sqlite artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.upstream.outputs.sqlite-artifact-id }}
          path: database

      - name: Download static artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.upstream.outputs.static-artifact-id }}
          path: resources/static

      - name: Rename database files
        run: |
          mv database/nusa.main-full.sqlite "nusa.$VERSION-full.sqlite"
          mv database/nusa.main.sqlite "nusa.$VERSION.sqlite"

      - name: Create archives
        run: ./.github/scripts/create-archives.sh --version "$VERSION"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" nusa.*.sqlite workbench/nusa.*.zip --clobber

  # Build job
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [upstream]

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          runtime: 'node@lts'
          install: true

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with VitePress
        run: pnpm docs:build

      - name: Download static artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.upstream.outputs.static-artifact-id }}
          path: resources/docs/.vitepress/dist/api

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: resources/docs/.vitepress/dist

  # Deployment job
  deploy:
    name: Deploy
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: [build]

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
